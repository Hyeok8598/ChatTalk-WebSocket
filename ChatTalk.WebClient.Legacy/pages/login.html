<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ChatTalk Login</title>
    <script type="module" src="../js/login.js" defer></script>
</head>
<body>
    <h2>로그인</h2>

    <form id="loginForm">
        <div>
            <label>ID</label>
            <input type="text" id="userIdInput" placeholder="아이디 입력">
        </div>

        <div>
            <label>Password</label>
            <input type="text" id="passwordInput" placeholder="비밀번호 입력">
        </div>

        <button type="submit" id="loginButton">로그인</button>
        <button type="button" id="singupPageButton">회원가입</button>
    </form>

    <p id="message"></p>
</body>
</html>
