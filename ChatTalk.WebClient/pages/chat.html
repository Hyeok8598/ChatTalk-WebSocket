<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>ChatTalk-WebSocket</title>
    <script type="module" src="../js/chat.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <h1>ChatTalk</h1>
    <div id="userListContainer">
        <label>접속자 목록</label>
        <div id="userListDiv"></div>
    </div>

    <div id="chatContainer"></div>
    
    <div id="whisper-popup" class="modal-popup hidden">
        <iframe src="../pages/popup/whisperPopup.html"></iframe>
    </div>

    <section>
        <button id="menuToggleButton">+</button>
        
        <div id="menuPanel" class="hidden">
            <button id="whisperButton">귓속말</button>
        </div>

        <label id="userNameText" style="display: block;"></label>
        <textarea id="messageTextArea"></textarea>
        <button id="sendButton">전송</button>
    </section>

    <section>
        <section style="display: none">
            <p id="statusText">상태 : 미접속</p>
        </section>
    </section>
</body>
</html>
